<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window">
        <div class="text" style="margin: 1rem 0 2rem 0;">
            <p class="heading">Book Library</p>
            <p class="sub-title">This project is for understanding the concepts of <b>Javascript Object Constructors</b> and their functions</p>
            <p class="sub-title">Here is <a href="https://github.com/siddhesh-ss/Library"><i>Github link</i></a></p>
        </div>
        <div class="form-div">
            <form action="">
                <div class="inputs">
                    <div class="title input">
                        <label for="book-title">Title</label>
                        <input type="text" id="book-title" required>
                    </div>
                    
                    <div class="author input">
                        <label for="book-author">Author</label>
                        <input type="text" id="book-author" required>
                    </div>
                        
                    <div class="pages input">
                        <label for="book-pages">Pages</label>
                        <input type="number" min="1" id="book-pages" required>
                    </div>
    
                    <div class="read-status input">
                        <label for="book-read">Read status</label>
                        <select name="Read" id="book-read">
                            <option value="read" selected>Read</option>
                            <option value="not-read">not Read</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submit-btn">Submit</button>
            </form>
        </div>

        
        <div class="table-div">
            <div class="sort">
                <label for="sorting">Sort by:</label>
                <select name="sorting" id="sorting">
                    <option value="newest" selected>Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="pages-inc">Pages ascending</option>
                    <option value="pages-dec">Pages descending</option>
                    <option value="read-stat">Read books</option>
                </select>
            </div>
            <table>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Pages</th>
                    <th>Read status</th>
                    <th></th>
                </tr>
                <tbody id="table-body">

                </tbody>
            </table>
        </div>


    </div>
    <script src="script.js"></script>
</body>
</html>
